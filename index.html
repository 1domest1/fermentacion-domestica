// Distancia aproximada (km) entre dos coordenadas (equirectangular, suficiente
// a escala de ciudad).
function distKm(aLat,aLon,bLat,bLon){
  const R=6371, toRad=Math.PI/180;
  const x=(bLon-aLon)*toRad*Math.cos(((aLat+bLat)/2)*toRad);
  const y=(bLat-aLat)*toRad;
  return Math.sqrt(x*x+y*y)*R;
}
function nearest(list, lat, lon){

// Preparaciones por "huella espacial": cuánto espacio/tiempo piden en casa.
//   compact = frasco pequeño, días/semanas | large = vasija/maduración de meses
const CRAFT_FOOTPRINT = { kombucha:'compact', 'kéfir':'compact', amazake:'compact',
  koji:'large', miso:'large', garum:'large', tempeh:'compact' };
function craftFor(product, seed, homeNormVal){
  const kind = PRODUCT_KIND[product] || 'verdura';
  let pool = CRAFT_FERMENTS.filter(c => c.fits.includes(kind));
  if(!pool.length) return null;
  // Vivienda pequeña (homeNormVal bajo) -> preferir preparaciones compactas;
  // vivienda grande -> permitir maduraciones largas (miso, garum, koji).
  if(homeNormVal!=null){
    const want = homeNormVal < 0.5 ? 'compact' : 'large';
    const pref = pool.filter(c => CRAFT_FOOTPRINT[c.craft] === want);
    if(pref.length) pool = pref;
  }
  return pool[Math.floor(seed*pool.length)%pool.length];
}
// Normalizadores: densidad en escala log (Bogotá ~7800 vs Amazonas ~1) y pobreza 0..1.

const DEFAULT_LOCALITY = 'candelaria';

// ===========================================================================
// PARSING de wikilinks y del Markdown ligero
// ===========================================================================
const WIKI = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
function extractWikilinks(body){ const out=[]; let m; WIKI.lastIndex=0; while((m=WIKI.exec(body))!==null){ out.push({id:m[1].trim()});} return out; }
function flatten(chs){ const out=[]; const w=l=>{for(const c of l){out.push(c); if(c.children)w(c.children);}}; w(chs); return out; }
const IMG=/^!\[([^\]]*)\]\(([^)]+)\)\s*$/, VID=/^@video\[([^\]]*)\]\(([^)]+)\)\s*$/;
function parseBody(body){
  const lines=body.split(String.fromCharCode(10)); const blocks=[]; let para=[];
  const flush=()=>{const t=para.join(' ').trim(); if(t)blocks.push({kind:'p',text:t}); para=[];};
  for(const raw of lines){ const line=raw.replace(/\s+$/,'');
    if(!line.trim()){flush();continue;}
    let mm;
    if((mm=line.match(IMG))){flush();blocks.push({kind:'image',caption:mm[1],src:mm[2]});continue;}
    if((mm=line.match(VID))){flush();blocks.push({kind:'video',caption:mm[1],src:mm[2]});continue;}
    if(line.startsWith('### ')){flush();blocks.push({kind:'h3',text:line.slice(4)});}
    else if(line.startsWith('## ')){flush();blocks.push({kind:'h2',text:line.slice(3)});}
    else if(line.startsWith('# ')){flush();blocks.push({kind:'h1',text:line.slice(2)});}
    else if(line.startsWith('> ')){flush();blocks.push({kind:'quote',text:line.slice(2)});}
    else para.push(line);
  }
  flush(); return blocks;
}

// ===========================================================================
// GRAFO a partir del contenido
// ===========================================================================
function buildGraph(thesis){
  const byId=new Map(thesis.entities.map(e=>[e.id,e]));
  const chapters=flatten(thesis.chapters);
  const rec=new Map(), chaptersOf=new Map(), lw=new Map();
  const bump=(m,k,by=1)=>m.set(k,(m.get(k)||0)+by);
  const pk=(a,b)=>a<b?a+'__'+b:b+'__'+a;
  for(const ch of chapters){
    const uniq=new Set();
    for(const {id} of extractWikilinks(ch.body)){
      if(!byId.has(id))continue;
      bump(rec,id); if(!chaptersOf.has(id))chaptersOf.set(id,new Set()); chaptersOf.get(id).add(ch.id); uniq.add(id);
    }
    const ids=[...uniq];
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)bump(lw,pk(ids[i],ids[j]));
  }
  for(const e of thesis.entities)for(const o of (e.relatedTo||[]))if(byId.has(o))bump(lw,pk(e.id,o),2);
  const deg=new Map(), links=[];
  for(const [k,w] of lw){const [s,t]=k.split('__'); links.push({source:s,target:t,weight:w}); bump(deg,s);bump(deg,t);}
  const nodes=thesis.entities.map(e=>({id:e.id,label:e.label,kind:e.kind,summary:e.summary,liveKey:e.liveKey,
    recurrence:rec.get(e.id)||0, degree:deg.get(e.id)||0, chapters:[...(chaptersOf.get(e.id)||[])]}));
  return {nodes,links};
}

function useLiveData(localityId){
  const [snapshot,setSnapshot]=useState(null);
  const latest=useRef(null);
  useEffect(()=>{
    const loc=localityById(localityId);
    const series=[
      {key:'harvest',label:'Alimentos en cosecha',unit:'t/día',base:420,min:120,max:900,phase:0,freq:0.00018,amp:260},
      {key:'waste',label:'Desperdicio de alimentos',unit:'t/día',base:180,min:40,max:420,phase:1.7,freq:0.00026,amp:150},
      {key:'production',label:'Producción de ingredientes',unit:'índice',base:100,min:55,max:160,phase:3.1,freq:0.00012,amp:42},
      {key:'fruit',label:'Producción de frutas',unit:'t/día',base:260,min:60,max:520,phase:0.8,freq:0.00021,amp:200},
      {key:'veg',label:'Producción de verduras',unit:'t/día',base:260,min:60,max:520,phase:2.5,freq:0.00016,amp:200},
      // Bogotá: clima frío de altiplano (~6-22 °C)
      {key:'humidity',label:'Humedad',unit:'%',base:75,min:40,max:98,phase:5,freq:0.00014,amp:22},
      {key:'temperature',label:'Temperatura',unit:'°C',base:14,min:4,max:24,phase:1.2,freq:0.00011,amp:8},
      {key:'price',label:'Precio promedio',unit:'COP/kg',base:3200,min:1800,max:5200,phase:4.4,freq:0.00009,amp:1400},
    ];
    const real={temperature:null,humidity:null}; let climateOk=false; let stopped=false;
    // Temperatura/humedad REALES en vivo de la localidad (Open-Meteo, Bogotá).
    const fetchClimate=async()=>{
      try{
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m`;
        const res=await fetch(url); if(!res.ok)return; const j=await res.json();
        if(j.current){ real.temperature=j.current.temperature_2m; real.humidity=j.current.relative_humidity_2m; climateOk=true; }
      }catch(e){}
    };
    const sample=()=>{
      const now=Date.now(); const values={}, raw={};
      for(const s of series){
        let c;
        if(s.key==='temperature'&&real.temperature!=null) c=Math.max(s.min,real.temperature);
        else if(s.key==='humidity'&&real.humidity!=null) c=Math.min(s.max,Math.max(s.min,real.humidity));
        else { const wv=Math.sin(now*s.freq+s.phase); const jt=(Math.random()-0.5)*0.25; c=Math.min(s.max,Math.max(s.min,s.base+s.amp*(wv*0.8+jt))); }
        const span=(s.max-s.min)||1;
        values[s.key]=Math.min(1,Math.max(0,(c-s.min)/span));
        raw[s.key]={value:Math.round(c),unit:s.unit,label:s.label};
      }
      // demografía por LOCALIDAD (embebida, DANE/Wikipedia)
      values.density=localDensityNorm(loc.density);
      values.poverty=povertyNorm(loc.poverty);
      values.homeSize=homeNorm(loc.homeSize);
      raw.density={value:loc.density,unit:'hab/km²',label:'Densidad ('+loc.name+')'};
      raw.poverty={value:loc.poverty,unit:'% vulnerab.',label:'Vulnerabilidad/pobreza ('+loc.name+')'};
      raw.homeSize={value:loc.homeSize,unit:'m² vivienda',label:'Tamaño de vivienda ('+loc.name+')'};
      const sourceLabel=climateOk
        ? `Clima real de ${loc.name}, Bogotá (Open-Meteo) · demografía DANE`
        : `${loc.name}: conectando clima real de Bogotá…`;
      return {t:now,values,raw,sourceLabel,localityId};
    };
    const push=()=>{ if(stopped)return; const snap=sample(); latest.current=snap; setSnapshot(snap); };
    fetchClimate().then(push);
    const ci=setInterval(fetchClimate,120000);
    push();
    const ti=setInterval(push,1500);
    return ()=>{ stopped=true; clearInterval(ci); clearInterval(ti); };
  },[localityId]);

}

// Modelo de efervescencia (energía, tensión, burst)
let _prevTension=0,_burst=0,_lastT=0;
const c01=x=>Math.min(1,Math.max(0,x)); const c11=x=>Math.min(1,Math.max(-1,x));
function computeEffervescence(snap){
  if(!snap) return {energy:0.1,tension:0,burst:0};
  const v=snap.values;
  const harvest=v.harvest||0, waste=v.waste||0, production=v.production||0, fruit=v.fruit||0, veg=v.veg||0, humidity=v.humidity||0, temperature=v.temperature||0, price=v.price||0;
  const density=v.density!=null?v.density:0; const poverty=v.poverty!=null?v.poverty:0;
  const abundance=(harvest+production)/2;
  const fruitDom=Math.max(0,fruit-veg);
  const climate=c11((temperature-0.5)+(humidity-0.5));   // calor+humedad sube; frío+sequedad baja
  const crossWP=waste*(1-production);
  const crossHP=harvest*price;
  const tension=c01(crossWP*0.9+crossHP*0.6);
  // Presión social: densidad (sobrepoblación) + pobreza (hambre) + desperdicio.
  const socialPressure=c01(density*0.4+poverty*0.4+waste*0.2);
  // La efervescencia sube también con esa presión social: donde más urge
  // aprovechar el excedente, el campo "hierve" más.
  const energy=c01(0.12+abundance*0.32+fruitDom*0.28+tension*0.55+climate*0.25+socialPressure*0.4);
  const now=snap.t; const dt=_lastT?Math.max(1,now-_lastT):1000;
  const rise=Math.max(0,tension-_prevTension);
  if(rise>0.02)_burst=c01(_burst+rise*6);
  _burst=c01(_burst-(dt/1000)*0.9);
  _prevTension=tension; _lastT=now;
  return {energy,tension,burst:_burst,socialPressure};
}
// Color (hue) de las partículas según el TIPO de fermentación recomendado.
const TYPE_HUE = { alcoholica:270, lactica:95, acetica:40, propionica:215, butirica:345 };
function recommendedTypeHue(snap){
  if(!snap||!snap.localityId) return null;
  try{ const r=recommend(snap, snap.localityId); return r&&r.type?TYPE_HUE[r.type]:null; }catch(e){ return null; }
}

// Recomendación de fermentación — cruce FINAL por LOCALIDAD de Bogotá:
//   localidad + clima real + excedente/desperdicio + sobrepoblación (densidad)
//   + hambre (vulnerabilidad) + tamaño de vivienda. Devuelve alimento, técnica,
//   tipo, preparación avanzada, prioridad social, y la HUERTA y PACA más cercanas.
function recommend(snap,localityId){
  if(!snap)return null;
  const loc=localityById(localityId); const v=snap.values;
  const fruit=v.fruit||0, veg=v.veg||0, waste=v.waste||0, humidity=v.humidity||0, temperature=v.temperature||0;
  const density=v.density!=null?v.density:0.5;   // sobrepoblación 0..1
  const poverty=v.poverty!=null?v.poverty:0.3;    // hambre/vulnerabilidad 0..1
  const climateScore=Math.min(1,Math.max(0,(temperature+humidity)/2));
  const useFruit=(fruit+waste*0.4)>=(veg+waste*0.4);
  const pool=useFruit?BOGOTA_FRUIT:BOGOTA_VEG;
  const seed=(snap.t/60000)%1; const choice=pool[Math.floor(seed*pool.length)%pool.length];
  const home=v.homeSize!=null?v.homeSize:0.5;   // tamaño de vivienda 0..1
  const craftSeed=(snap.t/90000)%1; const craft=craftFor(choice.product, craftSeed, home);
  // HUERTA y PACA más cercanas a la localidad (por coordenadas).
  const garden=nearest(GARDENS, loc.lat, loc.lon);
  const paca=nearest(PACAS_LIST, loc.lat, loc.lon);
  // Índice de aprovechamiento de residuos en pacas (crece con el desperdicio).
  const wasteUse=c01((v.waste||0)*0.85+0.1);
  const wasteUseLabel = wasteUse>0.6 ? 'alto' : (wasteUse>0.35 ? 'medio' : 'bajo');
  const eff=computeEffervescence(snap);
  const abundant=(useFruit?fruit:veg)>0.6||waste>0.6; const tipo=useFruit?'fruta':'verdura';

  // Índice de PRIORIDAD SOCIAL: dónde urge más aprovechar el excedente.
  const priority=c01(poverty*0.5+waste*0.3+density*0.2);
  let priorityLabel = priority>0.66 ? 'alta' : (priority>0.4 ? 'media' : 'baja');

  // Enfoque del fermento según el perfil de la localidad.
  let enfoque;
  if(poverty>0.5 && waste>0.4)
    enfoque=`En ${loc.name} coinciden alta vulnerabilidad (${loc.poverty}%) y desperdicio elevado: fermentar ${choice.product} para conservar y redistribuir excedente puede mitigar el hambre.`;
  else if(density>0.7)
    enfoque=`${loc.name} es muy densa (${loc.density.toLocaleString()} hab/km²): fermentos como ${choice.method} ofrecen alimento estable y de larga vida para muchas personas.`;
  else if(poverty>0.5)
    enfoque=`${loc.name} tiene vulnerabilidad alta (${loc.poverty}%): priorizar fermentos nutritivos y de bajo coste como ${choice.product}.`;
  else
    enfoque=`${loc.name}: condiciones moderadas; ${choice.product} aprovecha el excedente local sin urgencia social.`;

  let reason;
  if(climateScore<0.3) reason=`En ${loc.name} (Bogotá) el clima está frío ahora: la fermentación de ${choice.product} irá lenta, ideal para arranques largos de maduración.`;
  else if(abundant) reason=`Excedente alto de ${tipo} en ${loc.name}: aprovecha el pico para fermentar ${choice.product}.`;
  else reason=`En ${loc.name} las condiciones reales de Bogotá favorecen fermentar ${choice.product}.`;
  if(eff.tension>0.5) reason+=' El sistema muestra tensión (desperdicio/precio): fermentar estabiliza el excedente.';

  return {
    title:useFruit?'Fermentar fruta':'Fermentar verdura',
    product:choice.product, method:choice.method, type:choice.type,
    craft: craft ? { name:craft.craft, base:craft.base, type:craft.type, footprint:CRAFT_FOOTPRINT[craft.craft] } : null,
    reason, enfoque, climateScore,
    locality:loc.name,
    priority, priorityLabel,
    density, poverty, home, homeSizeM2:loc.homeSize,
    garden, paca, wasteUse, wasteUseLabel
  };
}

  const nodeAt=(mx,my)=>{const {x,y}=s2w(mx,my); for(let i=nodesRef.current.length-1;i>=0;i--){const n=nodesRef.current[i],r=baseR(n)+6; if((n.x-x)**2+(n.y-y)**2<=r*r)return n;} return null;};
  const drag=useRef({node:null,panning:false,lastX:0,lastY:0});
  const down=e=>{const rect=canvasRef.current.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,n=nodeAt(mx,my);
    if(n){drag.current={node:n,panning:false,lastX:mx,lastY:my};simRef.current&&simRef.current.alphaTarget(0.3).restart();n.fx=n.x;n.fy=n.y;}
    else drag.current={node:null,panning:true,lastX:mx,lastY:my}; e.target.setPointerCapture(e.pointerId);};
  const move=e=>{const rect=canvasRef.current.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,d=drag.current;
    if(d.node){const {x,y}=s2w(mx,my);d.node.fx=x;d.node.fy=y;}
    else if(d.panning){viewRef.current.tx+=mx-d.lastX;viewRef.current.ty+=my-d.lastY;d.lastX=mx;d.lastY=my;}
    else {hoverRef.current=(nodeAt(mx,my)||{}).id||null; canvasRef.current.style.cursor=hoverRef.current?'pointer':'grab';}};
  const up=e=>{const rect=canvasRef.current.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,d=drag.current;
    if(d.node){const moved=Math.abs(mx-d.lastX)+Math.abs(my-d.lastY); if(moved<4)onSelect(d.node.id===selectedId?null:d.node.id); d.node.fx=null;d.node.fy=null;simRef.current&&simRef.current.alphaTarget(0);}
    else if(d.panning){const moved=Math.abs(mx-d.lastX)+Math.abs(my-d.lastY); if(moved<4){const n=nodeAt(mx,my);onSelect(n?n.id:null);}}
    drag.current={node:null,panning:false,lastX:0,lastY:0};};
  const wheel=e=>{const f=e.deltaY<0?1.1:1/1.1; viewRef.current.scale=Math.min(4,Math.max(0.2,viewRef.current.scale*f));};
  return h('div',{ref:wrapRef,className:'canvas-wrap'},
    h('canvas',{ref:canvasRef,style:{touchAction:'none',cursor:'grab'},onPointerDown:down,onPointerMove:move,onPointerUp:up,onWheel:wheel}));
}

  );

function ParticleField({liveRef}){
  const canvasRef=useRef(null),wrapRef=useRef(null),partsRef=useRef([]),rafRef=useRef(0),spawnAcc=useRef(0),collapseRef=useRef(0);
  useEffect(()=>{
    const resize=()=>{const c=canvasRef.current,w=wrapRef.current; if(!c||!w)return; const dpr=window.devicePixelRatio||1;
      c.width=w.clientWidth*dpr; c.height=w.clientHeight*dpr; const ctx=c.getContext('2d'); if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);};
    resize(); window.addEventListener('resize',resize); return ()=>window.removeEventListener('resize',resize);
  },[]);
  useEffect(()=>{
    let prev=performance.now();
    const tick=now=>{
      const dt=Math.min(50,now-prev)/1000; prev=now;
      const c=canvasRef.current; if(!c){rafRef.current=requestAnimationFrame(tick);return;} const ctx=c.getContext('2d'); if(!ctx)return;
      const w=c.clientWidth,hh=c.clientHeight;
      const eff=computeEffervescence(liveRef.current); const energy=eff.energy;
      // Color según el TIPO de fermentación recomendado (varía al cambiar de
      // región / datos). Si no hay, cae al tono por tensión.
      const typeHue=recommendedTypeHue(liveRef.current);
      const coreHue=typeHue!=null?typeHue:(40-eff.tension*60);
      // Tamaño de vivienda: casas grandes -> burbujas algo mayores (más "espacio").
      const homeV=(liveRef.current&&liveRef.current.values&&liveRef.current.values.homeSize!=null)?liveRef.current.values.homeSize:0.5;
      const sizeMul=0.8+homeV*0.6;

      // NACIMIENTO: muchas partículas que aparecen en el borde inferior y suben
      // despacio, de modo que SIEMPRE hay flujo visible en toda la columna.
      const rate=90+energy*320+eff.burst*300; spawnAcc.current+=rate*dt; const toSpawn=Math.floor(spawnAcc.current); spawnAcc.current-=toSpawn;
      for(let i=0;i<toSpawn&&partsRef.current.length<5000;i++){
        partsRef.current.push({
          x:Math.random()*w, y:hh+6,
          vx:(Math.random()-0.5)*(8+energy*22),
          vy:-(28+Math.random()*34+energy*70),   // ascenso más lento => se ve el recorrido completo
          r:(1.1+Math.random()*(2.0+energy*2.6))*sizeMul,
          life:0, maxLife:9+Math.random()*5,      // viven mucho: cruzan toda la pantalla
          hue:coreHue+(Math.random()-0.5)*24
        });
      }

      // Limpieza del fondo en negro cada frame (sin estela: flujo nítido).
      ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#0a0a0c'; ctx.fillRect(0,0,w,hh);

      const ps=partsRef.current;
      // CONTEO de acumulación en el tercio superior -> "saturación" de la masa.
      // Cuando hay muchas partículas arriba, la banda COLAPSA en una capa casi
      // sólida (opaca y compacta) en el margen superior.
      let topCount=0; const topZone=hh*0.33;
      for(let i=0;i<ps.length;i++){ if(ps[i].y<topZone) topCount++; }
      // saturación 0..1: cuántas de las ~800 posibles en la zona alta hay ya.
      const saturation=Math.min(1, topCount/800);
      // la masa colapsada vive en un ref para suavizar (no saltar de golpe).
      collapseRef.current += (saturation - collapseRef.current) * Math.min(1, dt*2.5);
      const collapse=collapseRef.current;

      // ACUMULACIÓN SÓLIDA ARRIBA: altura por energía, pero la OPACIDAD y la
      // compactación crecen con el colapso -> casi una masa completa al saturar.
      const fillH=hh*(0.10+energy*0.42+collapse*0.12);
      const grad=ctx.createLinearGradient(0,0,0,fillH);
      const light=56+energy*14-collapse*10, sat=68+eff.tension*26, baseHue=coreHue;
      const topAlpha=Math.min(1, 0.55+energy*0.2+collapse*0.5); // -> ~1 (opaco) al colapsar
      grad.addColorStop(0, `hsla(${baseHue},${sat}%,${light}%,${topAlpha})`);
      grad.addColorStop(Math.min(0.95, 0.4+collapse*0.5), `hsla(${baseHue},${sat}%,${light}%,${topAlpha*0.6})`);
      grad.addColorStop(1, `hsla(${baseHue},${sat}%,${light}%,0)`);
      ctx.fillStyle=grad; ctx.fillRect(0,0,w,fillH);
      // Capa compacta superior: una franja casi sólida que aparece al colapsar.
      if(collapse>0.15){
        ctx.fillStyle=`hsla(${baseHue},${sat}%,${light}%,${Math.min(0.95,collapse)})`;
        ctx.fillRect(0,0,w,hh*0.06*collapse+2);
      }

      ctx.globalCompositeOperation='lighter';
      const turb=10+energy*80;
      // umbral de absorción: cuando colapsa, el "techo" baja y absorbe partículas.
      const ceiling=hh*(0.02+ (1-collapse)*0.06);
      for(let i=ps.length-1;i>=0;i--){
        const p=ps[i]; p.life+=dt;
        // absorción en el techo: al colapsar, las que llegan arriba se funden
        // en la masa (se eliminan al cruzar el ceiling).
        if(p.life>=p.maxLife||p.y<ceiling){ps.splice(i,1);continue;}

        // DENSIDAD CRECIENTE HACIA ARRIBA: 'up' va de 0 (abajo) a 1 (arriba).
        const up=Math.max(0, Math.min(1, 1-(p.y/hh)));
        p.vx+=Math.sin(now*0.004+p.y*0.05)*turb*dt;
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        // fricción suave que crece hacia arriba: frena poco a poco (acumulación)
        p.vy*=(1-0.35*dt*up);
        if(p.x<0)p.x+=w; if(p.x>w)p.x-=w;

        // aspecto: más arriba => más grande y más opaca (sensación de "lleno")
        const k=1-p.life/p.maxLife;
        const alpha=Math.min(0.92, 0.22+up*0.6)*Math.min(1,k*3);
        const rr=p.r*(0.85+up*1.0);
        // COLOR por altura: suave abajo (baja saturación, tono lavado) ->
        // intenso arriba (alta saturación, color pleno).
        const pSat=38+up*52;                 // 38% (suave) -> 90% (intenso)
        const pLight=72-up*26+energy*6;      // 72% (claro/pálido) -> 46% (pleno)
        ctx.beginPath();
        ctx.fillStyle=`hsla(${p.hue},${pSat}%,${pLight}%,${alpha})`;
        ctx.arc(p.x,p.y,rr,0,Math.PI*2); ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
      rafRef.current=requestAnimationFrame(tick);
    };
    rafRef.current=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(rafRef.current);
  },[]);
  return h('div',{ref:wrapRef,className:'canvas-wrap'},h('canvas',{ref:canvasRef}));
}

function LivePanel({snapshot,localityId}){
  if(!snapshot) return h('div',{className:'pad muted',style:{fontSize:14}},h('p',{className:'mono',style:{textTransform:'uppercase',fontSize:12}},'Datos en vivo'),h('p',null,'Conectando con la fuente…'));
  const rec=recommend(snapshot,localityId);
  return h('div',{className:'pad'},
    h('p',{className:'mono muted',style:{fontSize:12,textTransform:'uppercase',letterSpacing:'.06em'}},'Fuente'),
    h('h2',{style:{marginTop:4,fontSize:18}},snapshot.sourceLabel),
    h('p',{className:'mono muted',style:{marginTop:4,fontSize:11}},'Última lectura: '+new Date(snapshot.t).toLocaleTimeString()),
    rec&&h('div',{className:'rec-box',style:{marginTop:16}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('span',{className:'mono accent',style:{fontSize:10,textTransform:'uppercase',letterSpacing:'.06em'}},'Recomendación'),
        h('span',{className:'mono muted',style:{fontSize:10}},'clima '+Math.round(rec.climateScore*100)+'%')),
      h('p',{style:{marginTop:4,fontSize:14,fontWeight:600,color:'#f0e6d6'}},rec.title+': ',h('span',{className:'accent'},rec.product)),
      h('p',{className:'mono muted',style:{marginTop:2,fontSize:11}},'técnica: '+rec.method),
      // TIPO de fermentación bioquímica, destacado con color por tipo
      (FERMENT_TYPES[rec.type]) && h('div',{style:{marginTop:8,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:6,border:'1px solid '+FERMENT_TYPES[rec.type].color,
          color:FERMENT_TYPES[rec.type].color,borderRadius:999,padding:'3px 10px',fontSize:11,fontFamily:'ui-monospace,monospace'}},
          h('span',{style:{width:8,height:8,borderRadius:999,background:FERMENT_TYPES[rec.type].color,display:'inline-block'}}),
          'Fermentación '+FERMENT_TYPES[rec.type].label),
        h('span',{className:'mono muted',style:{fontSize:10}},FERMENT_TYPES[rec.type].desc)),
      h('p',{style:{marginTop:8,fontSize:12,lineHeight:1.5,color:'#cfcfd6'}},rec.reason),
      // Preparación de técnica avanzada (miso, garum, koji, kombucha, kéfir…)
      rec.craft && h('div',{style:{marginTop:10,border:'1px dashed #3a3a44',borderRadius:8,padding:'8px 10px'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:6}},
          h('span',{className:'mono',style:{fontSize:10,textTransform:'uppercase',letterSpacing:'.06em',color:'#2ac3de'}},'Preparación avanzada'),
          h('span',{className:'mono',style:{fontSize:12,fontWeight:600,color:'#f0e6d6',textTransform:'capitalize'}},rec.craft.name)),
        h('p',{style:{marginTop:4,fontSize:12,lineHeight:1.5,color:'#cfcfd6'}},rec.craft.base),
        h('p',{className:'mono muted',style:{marginTop:4,fontSize:10}},
          'vivienda '+rec.homeSizeM2+' m² ('+rec.locality+') · '+
          (rec.craft.footprint==='compact'?'preparación compacta, apta para espacios pequeños':'maduración amplia, requiere más espacio'))),
      // Prioridad social: identifica zonas con alta población + hambre + desperdicio
      h('div',{style:{marginTop:10,paddingTop:10,borderTop:'1px solid #26262e'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:8}},
          h('span',{className:'mono',style:{fontSize:10,textTransform:'uppercase',letterSpacing:'.06em',
            color: rec.priority>0.66?'#f7768e':(rec.priority>0.4?'#e0af68':'#9ece6a')}},
            'Prioridad de aprovechamiento: '+rec.priorityLabel),
          h('span',{className:'mono muted',style:{fontSize:10}},Math.round(rec.priority*100)+'%')),
        h('p',{style:{marginTop:6,fontSize:12,lineHeight:1.5,color:'#cfcfd6'}},rec.enfoque),
        h('div',{className:'mono muted',style:{marginTop:6,fontSize:10,display:'flex',flexWrap:'wrap',gap:'4px 12px'}},
          h('span',null,'población '+Math.round(rec.density*100)+'%'),
          h('span',null,'hambre/pobreza '+Math.round(rec.poverty*100)+'%'),
          h('span',null,'desperdicio '+Math.round((snapshot.values.waste||0)*100)+'%'))),
      // LOCALIDAD + huerta más cercana + paca más cercana + aprovechamiento residuos
      h('div',{style:{marginTop:10,paddingTop:10,borderTop:'1px solid #26262e'}},
        h('div',{style:{fontSize:12,color:'#cfcfd6',lineHeight:1.6}},
          h('span',{className:'mono',style:{fontSize:10,textTransform:'uppercase',letterSpacing:'.06em',color:'#2ac3de'}},'Localidad: '),

        rec.garden && h('div',{style:{marginTop:6,fontSize:12,color:'#cfcfd6',lineHeight:1.5}},
          '🌱 Huerta más cercana: ',h('span',{style:{color:'#9ece6a'}},rec.garden.name),
          h('span',{className:'mono muted'},' · '+rec.garden.km+' km')),
        rec.paca && h('div',{style:{marginTop:4,fontSize:12,color:'#cfcfd6',lineHeight:1.5}},
          '♻️ Paca digestora más cercana: ',h('span',{style:{color:'#e0af68'}},rec.paca.name),
          h('span',{className:'mono muted'},' · '+rec.paca.km+' km')),
        h('div',{className:'mono muted',style:{marginTop:6,fontSize:10}},
          'aprovechamiento de residuos en paca: '+rec.wasteUseLabel+' ('+Math.round(rec.wasteUse*100)+'%)'))),
    h('div',{style:{marginTop:20,display:'flex',flexDirection:'column',gap:16}},
      Object.entries(snapshot.raw).map(([key,r])=>{const norm=snapshot.values[key]||0; return h('div',{key},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline'}},
          h('span',{style:{fontSize:14,color:'#dedee4'}},r.label),
          h('span',{className:'mono accent',style:{fontSize:14}},r.value.toLocaleString()+' ',h('span',{className:'muted'},r.unit))),
        h('div',{className:'bar-track',style:{marginTop:4}},h('div',{className:'bar-fill',style:{width:Math.round(norm*100)+'%'}})),
        h('div',{className:'mono muted',style:{marginTop:2,fontSize:10}},'clave: '+key+' · intensidad '+Math.round(norm*100)+'%'));})),
    h('p',{className:'mono muted',style:{marginTop:24,border:'1px solid #26262e',background:'#0a0a0c',borderRadius:6,padding:'8px 12px',fontSize:12,lineHeight:1.5}},
      'Modelo por LOCALIDADES de Bogotá. Fuentes: temperatura y humedad en vivo de cada localidad (Open-Meteo); densidad poblacional por localidad (DANE/Wikipedia); vulnerabilidad/pobreza (DANE); tamaño de vivienda (DANE · Censo de Edificaciones); huertas urbanas (Jardín Botánico de Bogotá · Datos Abiertos Bogotá); pacas digestoras (Red Paquerxs Bogotá · Google My Maps). Cosecha, desperdicio, producción y precio son simulación de demostración. La recomendación final cruza clima + excedente + sobrepoblación + hambre + desperdicio + tamaño de vivienda y propone: alimento, técnica, tipo de fermentación, preparación avanzada, localidad, y la huerta y paca más cercanas.')
  );
}

// ===========================================================================
// APP
// ===========================================================================
function App(){
  const [tab,setTab]=useState('lectura');
  const [selectedId,setSelectedId]=useState(null);
  const [focusChapter,setFocusChapter]=useState(null);
  const [activeKinds,setActiveKinds]=useState(new Set(ALL_KINDS));
  const [localityId,setLocalityId]=useState(DEFAULT_LOCALITY);
  const graph=useMemo(()=>buildGraph(THESIS),[]);
  const {snapshot,latest}=useLiveData(localityId);
  const selectedNode=graph.nodes.find(n=>n.id===selectedId)||null;
  const openInGraph=id=>{setSelectedId(id);setTab('red');};
  const toggleKind=k=>setActiveKinds(prev=>{const n=new Set(prev); n.has(k)?n.delete(k):n.add(k); return n;});

  return h('div',{className:'app'},
    h('header',{className:'bar'},
      h('div',null,h('span',{className:'title'},THESIS.title),h('span',{className:'author'},THESIS.author)),
      h('nav',{className:'tabs'},[['lectura','Lectura'],['red','Red'],['vivo','Datos en vivo']].map(([id,label])=>
        h('button',{key:id,className:tab===id?'active':'',onClick:()=>setTab(id)},label)))),
    h('main',null,
      tab==='lectura'&&h(Reader,{focusChapter,onOpen:openInGraph}),
      tab==='red'&&h('div',{className:'split'},
        h('div',{className:'stage'},
          h('div',{className:'chip-row'},ALL_KINDS.map(k=>{const on=activeKinds.has(k);return h('button',{key:k,className:'chip',
            style:{borderColor:KIND_COLORS[k],color:on?'#0a0a0c':KIND_COLORS[k],background:on?KIND_COLORS[k]:'transparent',opacity:on?1:0.6},
            onClick:()=>toggleKind(k)},KIND_LABELS[k]);})),
          h(GraphView,{graph,activeKinds,selectedId,onSelect:setSelectedId}),
          h('p',{className:'hint'},'Red pura · tamaño = recurrencia · arrastra, zoom con rueda')),
        h('aside',{className:'panel'},h(NodePanel,{graph,node:selectedNode,onSelect:setSelectedId,onGoToChapter:cid=>{setFocusChapter(cid);setTab('lectura');}}))),
      tab==='vivo'&&h('div',{className:'split'},
        h('div',{className:'stage'},
          h('div',{className:'chip-row'},
            h('span',{className:'mono muted',style:{fontSize:11,textTransform:'uppercase',letterSpacing:'.06em'}},'Localidad'),
            h('select',{value:localityId,onChange:e=>setLocalityId(e.target.value)},LOCALITIES.map(l=>h('option',{key:l.id,value:l.id},l.name)))),
          h(ParticleField,{liveRef:latest}),
          h('p',{className:'hint'},'Partículas efervescentes · clima real de Bogotá · burbujean con los cruces de datos')),
        h('aside',{className:'panel'},h(LivePanel,{snapshot,localityId})))
    ));
}

const __root = document.getElementById('root');
__root.innerHTML = '';
ReactDOM.createRoot(__root).render(h(App));
} // fin de __APP_BOOT__
